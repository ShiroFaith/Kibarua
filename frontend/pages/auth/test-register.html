<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nirus Registration Tester</title>
    <style>
        body { font-family: Segoe UI, sans-serif; background: #f4f7fb; margin: 0; padding: 24px; }
        .card { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 26px rgba(0,0,0,.08); padding: 20px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { font-size: 13px; color: #334155; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        button { border: 0; border-radius: 8px; background: #0f766e; color: #fff; padding: 10px 14px; cursor: pointer; }
        .secondary { background: #475569; }
        pre { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 12px; min-height: 130px; overflow: auto; }
        .hint { color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Registration Test Script</h2>
        <p class="hint">Tests worker and employer registration against http://localhost/nirus/backend/index.php/api/auth/register using form-encoded payload.</p>

        <div class="row">
            <div>
                <label>Full Name</label>
                <input id="full_name" value="Tester User" />
            </div>
            <div>
                <label>Role</label>
                <select id="role">
                    <option value="worker">worker</option>
                    <option value="employer">employer</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div>
                <label>Email</label>
                <input id="email" type="email" />
            </div>
            <div>
                <label>Password</label>
                <input id="password" type="password" value="Password123" />
            </div>
        </div>

        <div class="actions">
            <button onclick="genEmail()">Generate Unique Email</button>
            <button class="secondary" onclick="test('worker')">Test Worker</button>
            <button class="secondary" onclick="test('employer')">Test Employer</button>
            <button onclick="probeCors()">Probe CORS</button>
        </div>

        <pre id="out">Ready.</pre>
    </div>

    <script>
        const API = 'http://localhost/nirus/backend/index.php/api/auth/register';
        const out = document.getElementById('out');

        function log(x) {
            out.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
        }

        function genEmail() {
            const t = Date.now();
            document.getElementById('email').value = `nirus_test_${t}@mailinator.com`;
            document.getElementById('full_name').value = `Nirus Test ${t}`;
            log('Generated unique email');
        }

        async function test(roleOverride) {
            if (!document.getElementById('email').value.trim()) genEmail();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('full_name').value.trim();
            const role = roleOverride || document.getElementById('role').value;

            const payload = new URLSearchParams({
                username: email.split('@')[0],
                email,
                password,
                confirm_password: password,
                full_name: fullName,
                role
            });

            try {
                const res = await fetch(API, { method: 'POST', body: payload });
                const text = await res.text();
                let body;
                try { body = JSON.parse(text); } catch { body = text; }
                log({ status: res.status, ok: res.ok, role, body });
            } catch (e) {
                log({ error: e.message });
            }
        }

        async function probeCors() {
            try {
                const res = await fetch(API, {
                    method: 'OPTIONS',
                    headers: {
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'content-type'
                    }
                });
                const headers = {};
                for (const [k, v] of res.headers.entries()) headers[k] = v;
                log({ status: res.status, headers });
            } catch (e) {
                log({ error: e.message });
            }
        }

        genEmail();
    </script>
</body>
</html>
